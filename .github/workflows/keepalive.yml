# Keeps the free Supabase project from pausing after a week with no activity.
# Put this file in your GitHub repo at:  .github/workflows/keepalive.yml
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 12 * * 1,4'   # Mondays and Thursdays, about 8 AM Eastern
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the pool
        run: |
          curl -fsS "https://enncimfagbwriiywobet.supabase.co/rest/v1/pool_clock?select=doc_ver&limit=1" \
            -H "apikey: sb_publishable_RxpwzEXvx7bBdzeOy1xVpg_ulV0OD7G" \
            -H "Authorization: Bearer sb_publishable_RxpwzEXvx7bBdzeOy1xVpg_ulV0OD7G"
 
